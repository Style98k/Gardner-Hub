<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thread — The Gardner Hub</title>
  <link rel="icon" type="image/png" href="../../assets/image/nobglogo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../js/tailwind-config.js"></script>

  <!-- Theme Management (loaded early to prevent flash) -->
  <script src="../../js/theme.js"></script>

  <style>
    /* Reddit-style thread lines */
    .comment-thread-line {
      position: absolute;
      left: 12px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: transparent;
      cursor: pointer;
      transition: background-color 0.15s ease;
      border-radius: 1px;
    }
    .comment-thread-line:hover {
      background-color: rgb(99 102 241 / 0.6) !important;
    }
    .comment-thread-line::before {
      content: '';
      position: absolute;
      left: -6px;
      right: -6px;
      top: 0;
      bottom: 0;
    }
    .dark .comment-thread-line {
      background-color: rgb(55 65 81);
    }
    .comment-thread-line {
      background-color: rgb(209 213 219);
    }
    /* Collapsed state */
    .comment-collapsed .comment-content,
    .comment-collapsed .comment-actions,
    .comment-collapsed .comment-replies {
      display: none;
    }
    .comment-collapsed .collapse-indicator {
      display: inline;
    }
    /* Reply input animation */
    .reply-input-wrap {
      animation: slideDown 0.2s ease-out;
    }
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="font-sans text-gray-800 dark:text-gray-200 min-h-screen bg-slate-50 dark:bg-black transition-colors duration-300">

  <!-- Header -->
  <header class="bg-gardner dark:bg-black border-b border-gardner-light dark:border-gray-800 sticky top-0 z-50 transition-colors duration-300">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-4">
          <button onclick="goBack()" class="p-2 rounded-lg hover:bg-white/20 dark:hover:bg-gray-800 transition-colors duration-200">
            <svg class="w-5 h-5 text-white dark:text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <div class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-white dark:bg-white shadow-md overflow-hidden">
            <img src="../../assets/image/logo.jpg" alt="Gardner Hub Logo" class="w-full h-full object-cover">
          </div>
          <div>
            <h1 class="text-xl font-bold text-white dark:text-white">The Gardner Hub</h1>
            <p class="text-xs text-gray-300 dark:text-gray-400">Thread View</p>
          </div>
        </div>

        <div class="flex items-center space-x-3">
          <button id="themeToggle" class="p-2 rounded-lg bg-gardner-light dark:bg-gray-800 hover:bg-white/20 dark:hover:bg-gray-700 transition-colors duration-200" title="Toggle theme">
            <svg class="w-5 h-5 text-yellow-500 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg class="w-5 h-5 text-yellow-300 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          </button>
          <div class="relative">
            <button id="profileMenuBtn" class="flex items-center space-x-2 hover:opacity-80 transition-opacity duration-200">
              <div class="w-8 h-8 rounded-full bg-white dark:bg-white flex items-center justify-center">
                <span class="text-gardner dark:text-black font-semibold text-sm" id="userInitial">U</span>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- Loading Spinner -->
    <div id="threadLoading" class="text-center py-16">
      <svg class="w-10 h-10 text-indigo-500 animate-spin mx-auto mb-3" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <p class="text-sm text-gray-500 dark:text-gray-400">Loading thread...</p>
    </div>

    <!-- Thread Content (populated by JS) -->
    <div id="threadContent" class="hidden">

      <!-- Post Card -->
      <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm mb-6">
        <div class="p-6">
          <!-- Author & Flair -->
          <div class="flex items-center flex-wrap gap-2 mb-3">
            <div class="flex items-center space-x-2">
              <div class="w-8 h-8 rounded-full bg-brand-900 dark:bg-white flex items-center justify-center">
                <span id="threadAuthorInitial" class="text-white dark:text-black font-semibold text-sm">U</span>
              </div>
              <div>
                <span id="threadAuthorName" class="text-sm font-semibold text-gray-900 dark:text-white"></span>
                <span id="threadAuthorBadge" class="ml-1 px-2 py-0.5 rounded-full text-[10px] font-semibold"></span>
              </div>
            </div>
            <span class="text-xs text-gray-400 dark:text-gray-500">&bull;</span>
            <span id="threadDate" class="text-xs text-gray-400 dark:text-gray-500"></span>
            <span id="threadFlair" class="hidden ml-auto inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold"></span>
          </div>

          <!-- Content -->
          <div id="threadBody" class="text-sm sm:text-base text-gray-700 dark:text-gray-300 leading-relaxed whitespace-pre-wrap"></div>

          <!-- Image -->
          <div id="threadImageWrap" class="hidden mt-4">
            <img id="threadImage" class="w-full rounded-lg border border-gray-200 dark:border-gray-700 max-h-96 object-cover" src="" alt="Thread image">
          </div>

          <!-- Actions Bar -->
          <div class="flex items-center space-x-6 mt-5 pt-4 border-t border-gray-100 dark:border-gray-800">
            <!-- Heart -->
            <button id="threadHeartBtn" onclick="togglePostHeart()" class="flex items-center space-x-1.5 group transition-colors duration-200 text-gray-400 dark:text-gray-500 hover:text-red-400">
              <svg id="threadHeartIcon" class="w-5 h-5 transition-transform duration-200 group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
              <span id="threadLikeCount" class="text-sm font-medium">0</span>
            </button>
            <!-- Comments count -->
            <div class="flex items-center space-x-1.5 text-gray-400 dark:text-gray-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
              <span id="threadCommentCount" class="text-sm font-medium">0</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Add Comment Box -->
      <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4 mb-6">
        <h4 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3 flex items-center gap-2">
          <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
          Join the conversation
        </h4>
        <div class="flex items-start space-x-3">
          <div class="w-8 h-8 rounded-full bg-brand-900 dark:bg-white flex items-center justify-center flex-shrink-0 mt-1">
            <span id="commentUserInitial" class="text-white dark:text-black font-semibold text-xs">U</span>
          </div>
          <div class="flex-1">
            <textarea id="commentInput" rows="3" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none placeholder-gray-400 dark:placeholder-gray-500" placeholder="Share your thoughts..."></textarea>
            <div class="flex justify-end mt-2">
              <button onclick="submitComment()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors duration-200 shadow-sm">Comment</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Comments Section -->
      <div class="mb-4">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/>
            </svg>
            Comments
            <span id="commentsCountBadge" class="px-2 py-0.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 rounded-full">0</span>
          </h3>
          <button onclick="window.scrollTo({top: document.getElementById('commentInput').offsetTop - 100, behavior: 'smooth'})" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
            </svg>
            Add comment
          </button>
        </div>
      </div>
      <div id="commentsContainer" class="space-y-1">
        <!-- Comments rendered by JS -->
      </div>

    </div>
  </div>

  <!-- Theme -->
  <script src="../../js/theme.js"></script>

  <script>
    var API_BASE = 'http://localhost:5000/api';
    var currentThreadId = null;
    var currentThread = null;

    var flairConfig = {
      'Lessons':    { bg: 'bg-indigo-100 dark:bg-indigo-900/30', text: 'text-indigo-700 dark:text-indigo-300', icon: '📘' },
      'Q&A':        { bg: 'bg-amber-100 dark:bg-amber-900/30',  text: 'text-amber-700 dark:text-amber-300',  icon: '❓' },
      'School Org': { bg: 'bg-emerald-100 dark:bg-emerald-900/30', text: 'text-emerald-700 dark:text-emerald-300', icon: '🏫' }
    };

    function getCurrentUser() {
      try { return JSON.parse(localStorage.getItem('gardnerHub_user')); } catch(e) { return null; }
    }

    function getToken() {
      return localStorage.getItem('gardnerHub_token');
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(text));
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      var d = new Date(dateStr);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function timeAgo(dateStr) {
      var now = new Date();
      var d = new Date(dateStr);
      var seconds = Math.floor((now - d) / 1000);
      if (seconds < 60) return 'just now';
      var minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + 'm ago';
      var hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h ago';
      var days = Math.floor(hours / 24);
      if (days < 30) return days + 'd ago';
      return formatDate(dateStr);
    }

    function getRoleBadgeClass(role) {
      switch(role) {
        case 'faculty': return 'bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300';
        case 'admin': return 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300';
        default: return 'bg-sky-100 dark:bg-sky-900/30 text-sky-700 dark:text-sky-300';
      }
    }

    function getRoleLabel(role) {
      switch(role) {
        case 'admin': return 'Admin';
        case 'faculty': return 'Faculty';
        default: return 'Student';
      }
    }

    // ─── Init ──────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {
      var user = getCurrentUser();
      if (!user) { window.location.href = '../../index.html'; return; }

      var initial = (user.full_name || 'U').charAt(0).toUpperCase();
      document.getElementById('userInitial').textContent = initial;
      document.getElementById('commentUserInitial').textContent = initial;

      var params = new URLSearchParams(window.location.search);
      currentThreadId = params.get('id');
      if (!currentThreadId) { window.location.href = 'hub.html'; return; }

      loadThread();
    });

    // ─── Load Thread ───────────────────────────────────────────────────────────
    function loadThread() {
      var token = getToken();
      var headers = {};
      if (token) headers['Authorization'] = 'Bearer ' + token;

      fetch(API_BASE + '/forum/threads/' + currentThreadId, { headers: headers })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          document.getElementById('threadLoading').classList.add('hidden');
          document.getElementById('threadContent').classList.remove('hidden');

          currentThread = data.thread;
          var t = data.thread;

          // Author
          document.getElementById('threadAuthorInitial').textContent = (t.author_name || 'U').charAt(0).toUpperCase();
          document.getElementById('threadAuthorName').textContent = t.author_name;
          var badge = document.getElementById('threadAuthorBadge');
          badge.textContent = getRoleLabel(t.author_role);
          badge.className = 'ml-1 px-2 py-0.5 rounded-full text-[10px] font-semibold ' + getRoleBadgeClass(t.author_role);

          document.getElementById('threadDate').textContent = timeAgo(t.created_at);
          document.getElementById('threadBody').textContent = t.content;

          // Flair
          if (t.tag && flairConfig[t.tag]) {
            var fc = flairConfig[t.tag];
            var flairEl = document.getElementById('threadFlair');
            flairEl.innerHTML = fc.icon + ' ' + escapeHtml(t.tag);
            flairEl.className = 'ml-auto inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold ' + fc.bg + ' ' + fc.text;
            flairEl.classList.remove('hidden');
          }

          // Image
          if (t.image_url && t.category === 'academic') {
            document.getElementById('threadImage').src = API_BASE.replace('/api', '') + '/uploads/academic/' + t.image_url;
            document.getElementById('threadImageWrap').classList.remove('hidden');
          }

          // Hearts
          document.getElementById('threadLikeCount').textContent = t.like_count || 0;
          document.getElementById('threadCommentCount').textContent = t.comment_count || 0;
          document.getElementById('commentsCountBadge').textContent = t.comment_count || 0;
          updateHeartUI(t.liked && t.liked > 0);

          // Comments (nested tree)
          renderComments(data.comments || []);
        })
        .catch(function() {
          document.getElementById('threadLoading').innerHTML = '<p class="text-gray-500 dark:text-gray-400">Unable to load thread. Server may be offline.</p>';
        });
    }

    // ─── Heart UI ──────────────────────────────────────────────────────────────
    function updateHeartUI(liked) {
      var btn = document.getElementById('threadHeartBtn');
      var icon = document.getElementById('threadHeartIcon');
      if (liked) {
        btn.classList.remove('text-gray-400', 'dark:text-gray-500', 'hover:text-red-400');
        btn.classList.add('text-red-500');
        icon.setAttribute('fill', 'currentColor');
      } else {
        btn.classList.add('text-gray-400', 'dark:text-gray-500', 'hover:text-red-400');
        btn.classList.remove('text-red-500');
        icon.setAttribute('fill', 'none');
      }
    }

    function togglePostHeart() {
      var token = getToken();
      if (!token) { alert('Please log in to like posts.'); return; }

      fetch(API_BASE + '/forum/threads/' + currentThreadId + '/like', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        document.getElementById('threadLikeCount').textContent = data.like_count;
        updateHeartUI(data.liked);
      })
      .catch(function() { alert('Unable to update reaction.'); });
    }

    // ─── Submit Comment ────────────────────────────────────────────────────────
    function submitComment(parentId) {
      var token = getToken();
      if (!token) { alert('Please log in to comment.'); return; }

      var inputEl;
      if (parentId) {
        inputEl = document.getElementById('reply-input-' + parentId);
      } else {
        inputEl = document.getElementById('commentInput');
      }

      var content = inputEl.value.trim();
      if (!content) { alert('Please write a comment.'); return; }

      var body = { content: content };
      if (parentId) body.parent_id = parentId;

      fetch(API_BASE + '/forum/threads/' + currentThreadId + '/comments', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify(body)
      })
      .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
      .then(function(result) {
        if (!result.ok) {
          alert(result.data.message || 'Failed to add comment.');
          return;
        }
        inputEl.value = '';

        // If replying to a parent, hide the reply input
        if (parentId) {
          var replyWrap = document.getElementById('reply-wrap-' + parentId);
          if (replyWrap) replyWrap.classList.add('hidden');
        }

        // Show moderation notice if content was filtered
        if (result.data.moderated) {
          showModerationToast();
        }

        // Reload to get updated nested tree
        loadThread();
      })
      .catch(function() { alert('Unable to connect to server.'); });
    }

    // ─── Show Moderation Toast ─────────────────────────────────────────────────
    function showModerationToast() {
      var existing = document.querySelector('.moderation-toast');
      if (existing) existing.remove();
      
      var toast = document.createElement('div');
      toast.className = 'moderation-toast fixed bottom-6 right-6 z-50 bg-amber-500 text-white px-5 py-3 rounded-lg shadow-lg flex items-center gap-3 animate-fade-in';
      toast.innerHTML = '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg><span>Academic Decorum: Your post was automatically moderated to ensure professional language.</span>';
      document.body.appendChild(toast);
      
      setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(function() { toast.remove(); }, 300);
      }, 5000);
    }

    // ─── Toggle Comment Heart ──────────────────────────────────────────────────
    function toggleCommentHeart(commentId, btn) {
      var token = getToken();
      if (!token) { alert('Please log in to like comments.'); return; }

      fetch(API_BASE + '/forum/comments/' + commentId + '/like', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var svg = btn.querySelector('svg');
        var countEl = btn.querySelector('.comment-like-count');
        if (data.liked) {
          btn.classList.remove('text-gray-400', 'dark:text-gray-500', 'hover:text-red-400');
          btn.classList.add('text-red-500');
          svg.setAttribute('fill', 'currentColor');
        } else {
          btn.classList.add('text-gray-400', 'dark:text-gray-500', 'hover:text-red-400');
          btn.classList.remove('text-red-500');
          svg.setAttribute('fill', 'none');
        }
        countEl.textContent = data.like_count;
      })
      .catch(function() { alert('Unable to update reaction.'); });
    }

    // ─── Show/Hide Reply Input ─────────────────────────────────────────────────
    function toggleReplyInput(commentId) {
      var wrap = document.getElementById('reply-wrap-' + commentId);
      if (wrap.classList.contains('hidden')) {
        wrap.classList.remove('hidden');
        document.getElementById('reply-input-' + commentId).focus();
      } else {
        wrap.classList.add('hidden');
      }
    }

    // ─── Cancel Reply ───────────────────────────────────────────────────────────
    function cancelReply(commentId) {
      var wrap = document.getElementById('reply-wrap-' + commentId);
      var input = document.getElementById('reply-input-' + commentId);
      input.value = '';
      wrap.classList.add('hidden');
    }

    // ─── Get Current User Initial ───────────────────────────────────────────────
    function getCurrentUserInitial() {
      var user = getCurrentUser();
      return user ? (user.full_name || 'U').charAt(0).toUpperCase() : 'U';
    }

    // ─── Collapse Thread (Reddit-style) ─────────────────────────────────────────
    function collapseThread(commentId) {
      var wrapper = document.querySelector('.comment-wrapper[data-comment-id="' + commentId + '"]');
      if (wrapper) {
        wrapper.classList.toggle('comment-collapsed');
      }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // RENDER THREADED COMMENTS (Reddit-style with indentation)
    // ═══════════════════════════════════════════════════════════════════════════

    function renderComments(comments) {
      var container = document.getElementById('commentsContainer');
      if (!comments || comments.length === 0) {
        container.innerHTML = '<div class="text-center py-10 bg-white dark:bg-gray-900/50 rounded-xl border border-dashed border-gray-200 dark:border-gray-800">' +
          '<svg class="w-10 h-10 text-gray-300 dark:text-gray-600 mx-auto mb-3" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">' +
            '<path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>' +
          '</svg>' +
          '<p class="text-gray-400 dark:text-gray-500 text-sm font-medium">No comments yet</p>' +
          '<p class="text-gray-400 dark:text-gray-600 text-xs mt-1">Be the first to share your thoughts!</p>' +
        '</div>';
        return;
      }
      container.innerHTML = comments.map(function(c) { return renderCommentNode(c, 0); }).join('');
    }

    function renderCommentNode(comment, depth) {
      var maxIndent = 8;
      var effectiveDepth = Math.min(depth, maxIndent);
      var marginLeft = effectiveDepth * 20; // 20px per level for tighter nesting

      var roleBadge = getRoleBadgeClass(comment.author_role);
      var roleLabel = getRoleLabel(comment.author_role);

      var liked = comment.liked && comment.liked > 0;
      var heartFill = liked ? 'fill="currentColor"' : 'fill="none"';
      var heartColor = liked ? 'text-red-500' : 'text-gray-400 dark:text-gray-500 hover:text-red-400';

      var hasReplies = comment.replies && comment.replies.length > 0;

      // Check if current user can delete this comment (ONLY admin)
      var user = getCurrentUser();
      var canDelete = user && user.role === 'admin';
      var deleteBtnHtml = '';
      if (canDelete) {
        deleteBtnHtml = '<button onclick="event.stopPropagation(); deleteComment(' + comment.id + ')" class="flex items-center space-x-1 text-gray-400 dark:text-gray-500 hover:text-red-500 transition-colors duration-200 group" title="Delete comment">' +
          '<svg class="w-3.5 h-3.5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>' +
        '</button>';
      }

      var html = '<div class="comment-wrapper relative" style="margin-left:' + marginLeft + 'px" data-comment-id="' + comment.id + '">';

      // Vertical thread line for nested comments
      if (depth > 0) {
        html += '<div class="comment-thread-line" onclick="collapseThread(' + comment.id + ')" title="Click to collapse"></div>';
      }

      // Comment card
      html += '<div class="comment-card bg-white dark:bg-gray-900/50 rounded-lg py-3 ' + (depth > 0 ? 'pl-5' : 'p-4 border border-gray-200 dark:border-gray-800') + ' mb-2">';

      // Author row
      html += '<div class="flex items-center space-x-2 mb-2">' +
        '<div class="w-6 h-6 rounded-full bg-brand-900 dark:bg-white flex items-center justify-center flex-shrink-0">' +
          '<span class="text-white dark:text-black font-semibold" style="font-size:10px">' + (comment.author_name || 'U').charAt(0).toUpperCase() + '</span>' +
        '</div>' +
        '<span class="text-xs font-semibold text-gray-900 dark:text-white">' + escapeHtml(comment.author_name) + '</span>' +
        '<span class="px-1.5 py-0.5 rounded text-[9px] font-semibold ' + roleBadge + '">' + roleLabel + '</span>' +
        '<span class="text-[11px] text-gray-400 dark:text-gray-500">&bull; ' + timeAgo(comment.created_at) + '</span>' +
        '<span class="collapse-indicator hidden text-[11px] text-gray-400 dark:text-gray-500 ml-2">[collapsed]</span>' +
      '</div>';

      // Content
      html += '<div class="comment-content">';
      html += '<p class="text-sm text-gray-700 dark:text-gray-300 leading-relaxed mb-3 whitespace-pre-wrap">' + escapeHtml(comment.content) + '</p>';
      html += '</div>';

      // Actions: Heart + Reply + Delete
      html += '<div class="comment-actions flex items-center space-x-4">' +
        '<button onclick="event.stopPropagation(); toggleCommentHeart(' + comment.id + ', this)" class="flex items-center space-x-1 transition-colors duration-200 ' + heartColor + ' group">' +
          '<svg class="w-3.5 h-3.5 transition-transform group-hover:scale-110" ' + heartFill + ' stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>' +
          '<span class="text-[11px] font-medium comment-like-count">' + (comment.like_count || 0) + '</span>' +
        '</button>' +
        '<button onclick="toggleReplyInput(' + comment.id + ')" class="flex items-center space-x-1 text-gray-400 dark:text-gray-500 hover:text-indigo-500 dark:hover:text-indigo-400 transition-colors duration-200 group">' +
          '<svg class="w-3.5 h-3.5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>' +
          '<span class="text-[11px] font-medium">Reply</span>' +
        '</button>' +
        deleteBtnHtml +
      '</div>';

      // Nested reply input (hidden by default)
      html += '<div id="reply-wrap-' + comment.id + '" class="reply-input-wrap hidden mt-3">' +
        '<div class="flex items-start space-x-2">' +
          '<div class="w-5 h-5 rounded-full bg-brand-900 dark:bg-white flex items-center justify-center flex-shrink-0 mt-1">' +
            '<span class="text-white dark:text-black font-semibold" style="font-size:8px">' + getCurrentUserInitial() + '</span>' +
          '</div>' +
          '<div class="flex-1">' +
            '<textarea id="reply-input-' + comment.id + '" rows="2" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none placeholder-gray-400 dark:placeholder-gray-500" placeholder="Write a reply..."></textarea>' +
            '<div class="flex justify-end space-x-2 mt-2">' +
              '<button onclick="cancelReply(' + comment.id + ')" class="px-3 py-1.5 text-xs font-medium text-gray-600 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors duration-200">Cancel</button>' +
              '<button onclick="submitComment(' + comment.id + ')" class="px-3 py-1.5 text-xs font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors duration-200">Reply</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

      html += '</div>'; // close comment card

      // Render child replies recursively
      if (hasReplies) {
        html += '<div class="comment-replies">';
        comment.replies.forEach(function(reply) {
          html += renderCommentNode(reply, depth + 1);
        });
        html += '</div>';
      }

      html += '</div>'; // close relative wrapper

      return html;
    }

    function goBack() {
      if (document.referrer && document.referrer.indexOf('category-view') !== -1) {
        window.history.back();
      } else {
        // Try to go back to the category view
        var cat = currentThread ? currentThread.category : 'academic';
        window.location.href = 'category-view.html?category=' + cat;
      }
    }

    // ─── Delete Comment ───────────────────────────────────────────────────────
    function deleteComment(commentId) {
      if (!confirm('Are you sure you want to delete this comment? This action cannot be undone.')) {
        return;
      }
      
      var token = getToken();
      if (!token) {
        alert('You must be logged in to delete comments.');
        return;
      }
      
      fetch(API_BASE + '/forum/comments/' + commentId, {
        method: 'DELETE',
        headers: {
          'Authorization': 'Bearer ' + token
        }
      })
      .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
      .then(function(result) {
        if (!result.ok) {
          alert(result.data.message || 'Failed to delete comment.');
          return;
        }
        alert('Comment deleted successfully.');
        // Reload thread to refresh comments
        loadThread(currentThreadId);
      })
      .catch(function() {
        alert('Unable to connect to server.');
      });
    }
  </script>
</body>
</html>
